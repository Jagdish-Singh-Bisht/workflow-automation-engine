<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile Credentials</title>
</head>

<body>

    <div th:fragment="content">

        <h2>Connected Service</h2>

        <p>Configure the services your workflow can use.</p>

        <hr>

        <div class="card p-3 mb-3">

            <h5>Gemini</h5>

            <p>
                <span th:if="${#lists.isEmpty(credentials)}">
                    Not configured
                </span>

                <span th:unless="${#lists.isEmpty(credentials)}">
                    Configured
                </span>
            </p>

            <button class="btn btn-primary">
                Configure
            </button>

        </div>

        <div class="card p-3 mb-3">

            <h5>Email</h5>

            <p>Not configured</p>

            <button class="btn btn-primary">
                Configure
            </button>

        </div>

        <div class="card p-3 mb-3">

            <h5>WhatsApp</h5>

            <p>Not configured</p>

            <button class="btn btn-primary">
                Configure
            </button>

        </div>


    </div>

</body>

</html>
