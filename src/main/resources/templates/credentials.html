<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile Credentials</title>
</head>

<body>

    <div th:fragment="content">

        <h2>Connected Service</h2>

        <p>Configure the services your workflow can use.</p>

        <hr>

        <div class="card p-3 mb-3">

            <h5>Gemini</h5>

            <p>
                <span th:if="${geminiConfigured}">
                    Configured
                </span>

                <span th:unless="${geminiConfigured}">
                    Not configured
                </span>
            </p>

            <a th:if="${geminiConfigured}"
               th:href="@{/profile/credentials/gemini}"
               class="btn btn-primary">
                Update
            </a>

            <a th:unless="${geminiConfigured}"
               th:href="@{/profile/credentials/gemini}"
               class="btn btn-primary">
                Configure
            </a>

            <form th:if="${geminiConfigured}"
                  th:action="@{/profile/credentials/gemini/delete}"
                  method="post"
                  style="display:inline;">

                <button type="submit"
                        class="btn btn-danger"
                        onclick="return confirm('Remove your Gemini Credentials?');">
                    Remove
                </button>

            </form>



        </div>

        <div class="card p-3 mb-3">

            <h5>Email</h5>

            <p>Not configured</p>

            <button class="btn btn-primary">
                Configure
            </button>

        </div>

        <div class="card p-3 mb-3">

            <h5>WhatsApp</h5>

            <p>Not configured</p>

            <button class="btn btn-primary">
                Configure
            </button>

        </div>


    </div>

</body>

</html>
