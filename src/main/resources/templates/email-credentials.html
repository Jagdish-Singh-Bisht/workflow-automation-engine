<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Credentials</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div th:fragment="content">

    <div class="mb-4">

        <h2>Email Credentials</h2>

        <p class="text-muted mb-0">
            Connect your email account to send mails from your workflows.
        </p>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <form th:action="@{/profile/credentials/email}"
                  method="post">

                <div class="mb-3">

                    <label class="form-label">
                        Email / SMTP Username
                    </label>

                    <input type="email"
                           name="emailUsername"
                           class="form-control"
                           placeholder="your@email.com"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        App Password
                    </label>

                    <input type="password"
                           name="appPassword"
                           class="form-control"
                           placeholder="Enter your app password"
                           required>

                </div>


                <button type="submit"
                        class="btn btn-primary">
                    Save
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
