<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Credentials</title>
</head>

<body>

    <div th:fragment="content">

        <h2>Email Credentials</h2>

        <p>Connect your email account to send mails from your workflows.</p>

        <hr>

        <form th:action="@{/profile/credentials/email}"
        method="post">

            <div class="mb-3">
                <label>Email / SMTP username</label>

                <input type="email"
                       name="emailUsername"
                       class="form-control"
                       placeholder="your@email.com">

            </div>

            <div class="mb-3">
                <label>App password</label>

                <input type="password"
                       name="appPassword"
                       class="form-control"
                       placeholder="Enter your app password">

            </div>

            <button type="submit"
                    class="btn btn-primary">
                Save
            </button>

        </form>

    </div>

</body>

</html>
