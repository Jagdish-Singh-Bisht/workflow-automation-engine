<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gemini Provider</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div th:fragment="content">

    <div class="mb-4">

        <h2>Gemini Credentials</h2>

        <p class="text-muted mb-0">
            Connect your Gemini API key to use Gemini in your workflows.
        </p>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <form th:action="@{/profile/credentials/gemini}"
                  method="post">

                <div class="mb-3">

                    <label class="form-label">
                        Gemini API Key
                    </label>

                    <input type="password"
                           name="credentialValue"
                           class="form-control"
                           placeholder="Enter your Gemini API key"
                           required>

                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Save
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
