<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gemini Provider</title>
</head>

<body>

    <div th:fragment="content">

        <h2>Gemini Credentials</h2>

        <p>Connect your Gemini API key to use Gemini in your workflows.</p>

        <form th:action="@{/profile/credentials/gemini}"
        method="post">

            <div class="mb-3">

                <label>Gemini API Key</label>

                <input type="password"
                       name="credentialValue"
                       class="form-control"
                       placeholder="Enter you Gemini API Key">

            </div>

            <button type="submit" class="btn btn-primary">
                Save
            </button>

        </form>

    </div>

</body>
</html>
