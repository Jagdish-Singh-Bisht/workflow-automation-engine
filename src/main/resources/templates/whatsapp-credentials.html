<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WhatsApp Credentials</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body>

<div th:fragment="content">

    <div class="mb-4">

        <h2>WhatsApp Credentials</h2>

        <p class="text-muted mb-0">
            Connect your Twilio account to send WhatsApp messages
            from your workflows.
        </p>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <form th:action="@{/profile/credentials/whatsapp}"
                  method="post">

                <div class="mb-3">

                    <label for="whatsappNumber"
                           class="form-label">
                        Your WhatsApp Number
                    </label>

                    <input type="text"
                           id="whatsappNumber"
                           name="whatsappNumber"
                           class="form-control"
                           placeholder="Enter WhatsApp Number"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Twilio Account SID
                    </label>

                    <input type="text"
                           name="accountSid"
                           class="form-control"
                           placeholder="Enter your Twilio Account SID"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Twilio Auth Token
                    </label>

                    <input type="password"
                           name="authToken"
                           class="form-control"
                           placeholder="Enter your Twilio Auth Token"
                           required>

                </div>


                <button type="submit"
                        class="btn btn-primary">
                    Save
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
