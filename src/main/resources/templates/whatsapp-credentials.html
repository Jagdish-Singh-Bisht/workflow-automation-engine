<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WhatsApp Credentials</title>
</head>

<body>

    <div th:fragment="content">

        <h2>WhatsApp Credentials</h2>

        <p>Connect your Twilio account to send WhatsApp messages from your workflows.</p>

        <hr>

        <form th:action="@{/profile/credentials/whatsapp}"
        method="post">

            <div class="mb-3">
                <label>Twilio Account SID</label>


                <input type="text"
                       name="accountSid"
                       class="form-control"
                       placeholder="Enter your Twilio Account SID">

            </div>

            <div class="mb-3">
                <label>Twilio Auth Token</label>

                <input type="text"
                       name="authToken"
                       class="form-control"
                       placeholder="Enter your Twilio Auth Token">

            </div>

            <button type="submit"
                    class="btn btn-primary">
                Save
            </button>


        </form>
    </div>



</body>

</html>
